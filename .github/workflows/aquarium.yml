name: Update Aquarium

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-aquarium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate 2D Aquarium
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import random
          import re
          import os

          ORG = "it-scripts"
          REPO = "it-drugs"

          # 1. Fetch Stars
          url = f"https://api.github.com/repos/{ORG}/{REPO}"
          req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Action"})
          try:
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode())
              stars = data.get("stargazers_count", 0)
          except Exception as e:
            print(f"Warning: Could not fetch API ({e}), using default fallback.")
            stars = 123

          print(f"Loaded {stars} stars for {ORG}/{REPO}")

          # 2. Dimensions & Assets
          WIDTH = 50
          HEIGHT = 8

          FISH_RIGHT = ["><(((º>", "><>", ">°))))><", "><(((*>"]
          FISH_LEFT  = ["<º)))><", "<><", "<((((°<", "<*)))><"]
          BUBBLES = [".", "o", "°"]

          random.seed(stars)

          grid = [[" " for _ in range(WIDTH)] for _ in range(HEIGHT)]

          for _ in range(7):
            r = random.randint(0, HEIGHT - 2)
            c = random.randint(0, WIDTH - 1)
            grid[r][c] = random.choice(BUBBLES)

          num_fish = max(3, min(10, stars // 12))

          for _ in range(num_fish):
            sprite = random.choice(FISH_RIGHT if random.random() > 0.4 else FISH_LEFT)
            slen = len(sprite)
            for _ in range(25):
              r = random.randint(0, HEIGHT - 2)
              c = random.randint(0, WIDTH - slen - 1)
              if all(grid[r][c + i] in [" ", ".", "o", "°"] for i in range(slen)):
                for i, char in enumerate(sprite):
                  grid[r][c + i] = char
                break

          seabed = list("vvvvvvvvvvvvv.vvvvvvvvvvvvvv.vvvvvvvvvvvvvvvvvvvvv"[:WIDTH])
          crab = "(V)(°,,,,°)(V)"
          crab_pos = random.randint(2, WIDTH - len(crab) - 2)
          for i, ch in enumerate(crab):
            grid[HEIGHT - 1][crab_pos + i] = ch

          border = "+-" + "-" * WIDTH + "-+"
          water_surface = "~ " * (WIDTH // 2)

          lines = [
            "```text",
            border,
            f"| {water_surface} |"
          ]
          for row in grid:
            lines.append(f"| {''.join(row)} |")
          lines.append(f"| {''.join(seabed)} |")
          lines.append(border)
          lines.append(f" Repo: {ORG}/{REPO} | ⭐ {stars} Stars (Population: {num_fish} Fish)")
          lines.append("```")

          tank_output = "\n".join(lines)

          # 3. Write into README.md
          readme_path = "README.md" if os.path.exists("README.md") else "readme.md"
          if not os.path.exists(readme_path):
            with open("README.md", "w", encoding="utf-8") as f:
              f.write("# Profile\n\n")
            readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as f:
            content = f.read()

          pattern = r"<!-- AQUARIUM:START -->[\s\S]*?<!-- AQUARIUM:END -->"
          replacement = f"<!-- AQUARIUM:START -->\n{tank_output}\n<!-- AQUARIUM:END -->"

          if re.search(pattern, content):
            new_content = re.sub(pattern, replacement, content)
            print("Found existing markers. Replacing aquarium content.")
          else:
            print("Markers not found. Appending aquarium to the end of README.")
            new_content = content.rstrip() + f"\n\n### 🐟 Live Tank\n{replacement}\n"

          with open(readme_path, "w", encoding="utf-8") as f:
            f.write(new_content)

          print(f"Successfully wrote changes to {readme_path}.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: update aquarium"
            git push
          fi
