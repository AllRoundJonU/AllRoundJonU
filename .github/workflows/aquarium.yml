name: Update Aquarium

on:
  schedule:
    - cron: "0 0 * * *" # Täglich um Mitternacht
  workflow_dispatch: # Ermöglicht manuelles Starten im Actions-Tab

permissions:
  contents: write

jobs:
  render-aquarium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate 2D Aquarium
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import random
          import re

          ORG = "it-scripts"
          REPO = "it-drugs"

          # 1. Fetch Stars
          url = f"https://api.github.com/repos/{ORG}/{REPO}"
          req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Action"})
          try:
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode())
              stars = data.get("stargazers_count", 0)
          except Exception as e:
            print(f"Error fetching repo: {e}")
            stars = 123

          # 2. Dimensions & Assets
          WIDTH = 50
          HEIGHT = 8

          FISH_RIGHT = ["><(((º>", "><>", ">°))))><", "><(((*>"]
          FISH_LEFT  = ["<º)))><", "<><", "<((((°<", "<*)))><"]
          BUBBLES = [".", "o", "°"]

          # Fixed seed based on stars + current day for stability
          random.seed(stars)

          # Grid initialization
          grid = [[" " for _ in range(WIDTH)] for _ in range(HEIGHT)]

          # Add ambient bubbles
          for _ in range(7):
            r = random.randint(0, HEIGHT - 2)
            c = random.randint(0, WIDTH - 1)
            grid[r][c] = random.choice(BUBBLES)

          # Calculate fish count (1 fish per ~12 stars, max 10 to avoid crowding)
          num_fish = max(3, min(10, stars // 12))

          for _ in range(num_fish):
            sprite = random.choice(FISH_RIGHT if random.random() > 0.4 else FISH_LEFT)
            slen = len(sprite)
            # Try finding a free spot
            for _ in range(20):
              r = random.randint(0, HEIGHT - 2)
              c = random.randint(0, WIDTH - slen - 1)
              # Check collision
              if all(grid[r][c + i] in [" ", ".", "o", "°"] for i in range(slen)):
                for i, char in enumerate(sprite):
                  grid[r][c + i] = char
                break

          # Ground decorations
          seabed = list("vvvvvvvvvvvvv.vvvvvvvvvvvvvv.vvvvvvvvvvvvvvvvvvvvv"[:WIDTH])
          # Place a little crab at the bottom
          crab = "(V)(°,,,,°)(V)"
          crab_pos = random.randint(2, WIDTH - len(crab) - 2)
          for i, ch in enumerate(crab):
            grid[HEIGHT - 1][crab_pos + i] = ch

          # 3. Assemble ASCII Output
          border = "+-" + "-" * WIDTH + "-+"
          water_surface = "~ " * (WIDTH // 2)

          lines = [
            "```text",
            border,
            f"| {water_surface} |"
          ]
          for row in grid:
            lines.append(f"| {''.join(row)} |")
          lines.append(f"| {''.join(seabed)} |")
          lines.append(border)
          lines.append(f" Repo: {ORG}/{REPO} | ⭐ {stars} Stars (Population: {num_fish} Fish)")
          lines.append("```")

          tank_output = "\n".join(lines)

          # 4. Inject into README.md
          with open("README.md", "r", encoding="utf-8") as f:
            content = f.read()

          pattern = r"<!-- AQUARIUM:START -->[\s\S]*?<!-- AQUARIUM:END -->"
          replacement = f"<!-- AQUARIUM:START -->\n{tank_output}\n<!-- AQUARIUM:END -->"

          if re.search(pattern, content):
            new_content = re.sub(pattern, replacement, content)
            with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
            print("README updated successfully.")
          else:
            print("Markers <!-- AQUARIUM:START --> and <!-- AQUARIUM:END --> not found!")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: populate aquarium"
            git push
          fi
